<!-- Barra fija de zoom: Reset | − | 100% | + -->
<div id="zoom-toolbar">
  <button id="zoom-reset" title="Restablecer zoom a 100%">⟲</button>
  <button id="zoom-out" title="Alejar">−</button>
  <button id="zoom-level" title="Recargar sin caché (equivalente a Ctrl+F5)">100%</button>
  <button id="zoom-in" title="Acercar">+</button>
</div>

<div id="zoom-content">
  <div id="sheet-sync-container">
    <h1>LR WEB CATALOG Genérico</h1>
    <div class="sheet-sync-header">
      <span>Última sincronización: <span id="sheet-sync-time">—</span></span>
      <button id="sheet-sync-refresh">Actualizar ahora</button>
    </div>
    <div id="sheet-sync-count"></div>
    <div id="sheet-sync-status"></div>
    <div id="sheet-sync-list"></div>
  </div>
</div>

<script>
(function () {
  // ============================================================
  //  CONTROL DE ZOOM RESPONSIVE
  // ============================================================
  // Usa la propiedad CSS "zoom" (nativa, reacomoda el layout real,
  // igual que Ctrl + "+"/"-" del navegador). Nunca genera scroll
  // horizontal: el contenido solo crece hacia abajo.
  // Si el navegador no soporta "zoom" (Firefox viejo, etc.), se
  // usa un fallback con transform: scale() ajustando el ancho
  // para evitar el scroll horizontal.
  const ZOOM_MIN = 70;
  const ZOOM_MAX = 160;
  const ZOOM_STEP = 10;
  const ZOOM_DEFAULT = 100;
  const STORAGE_KEY = "lrwebcatalog_zoom_level";

  const zoomContent = document.getElementById("zoom-content");
  const zoomLevelBtn = document.getElementById("zoom-level");
  const zoomInBtn = document.getElementById("zoom-in");
  const zoomOutBtn = document.getElementById("zoom-out");
  const zoomResetBtn = document.getElementById("zoom-reset");

  // Detección de soporte nativo de "zoom" (Chrome, Edge, Safari lo
  // soportan; Firefox históricamente no).
  const supportsNativeZoom = CSS.supports("zoom: 1.5");

  function clamp(value) {
    return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, value));
  }

  function loadZoom() {
    const stored = parseInt(localStorage.getItem(STORAGE_KEY), 10);
    if (!isNaN(stored) && stored >= ZOOM_MIN && stored <= ZOOM_MAX) {
      return stored;
    }
    return ZOOM_DEFAULT;
  }

  function applyZoom(level) {
    const factor = level / 100;
    if (supportsNativeZoom) {
      zoomContent.style.zoom = String(factor);
      zoomContent.style.transform = "";
      zoomContent.style.width = "";
    } else {
      // Fallback con transform: scale(). Para que no aparezca scroll
      // horizontal, compensamos el ancho en proporción inversa al
      // factor de escala, ya que transform no reacomoda el layout.
      zoomContent.style.transformOrigin = "top left";
      zoomContent.style.transform = `scale(${factor})`;
      zoomContent.style.width = `${100 / factor}%`;
    }
    zoomLevelBtn.textContent = `${level}%`;
    zoomLevelBtn.dataset.level = String(level);
    localStorage.setItem(STORAGE_KEY, String(level));
  }

  function changeZoom(delta) {
    const current = parseInt(zoomLevelBtn.dataset.level, 10) || ZOOM_DEFAULT;
    applyZoom(clamp(current + delta));
  }

  // El botón de porcentaje ("100%") NO solo resetea: fuerza una
  // recarga sin caché, simulando Ctrl+F5. Se agrega un parámetro
  // de timestamp para invalidar la caché y se usa location.replace
  // para no dejar entrada extra en el historial.
  function hardReload() {
    const base = window.location.href.split("?")[0].split("#")[0];
    window.location.replace(`${base}?_=${Date.now()}`);
  }

  zoomInBtn.addEventListener("click", () => changeZoom(ZOOM_STEP));
  zoomOutBtn.addEventListener("click", () => changeZoom(-ZOOM_STEP));
  zoomResetBtn.addEventListener("click", () => applyZoom(ZOOM_DEFAULT));
  zoomLevelBtn.addEventListener("click", hardReload);

  applyZoom(loadZoom());
})();
</script>

<script>
(function () {
  // ============================================================
  //  SINCRONIZACIÓN CON GOOGLE SHEETS (sin cambios de lógica)
  // ============================================================
  // A diferencia de la versión anterior, esta app NO busca columnas por nombre.
  // Toma todas las columnas que existan en la planilla, en el orden en que
  // aparezcan, y decide cómo mostrar cada valor según su propio contenido
  // (por ejemplo, si "parece" una URL o no). Si agregás, quitás o reordenás
  // columnas en la planilla, la página se adapta sola sin tocar el código.
  const SHEET_ID = "1dkGOT3XaPuHa8Kpj_UpD_sKkSGCs_1P5HyL_Z2IIcmQ";  const GID = "0";
  const REFRESH_MS = 86400000; // vuelve a sincronizar cada 24 horas
  const URL_REGEX = /^https?:\/\//i;

  // "headers=1" le indica explícitamente a Google que la fila 1 es el
  // encabezado. Sin este parámetro, si la planilla no lo detecta sola,
  // los encabezados quedan vacíos y la fila 1 se cuela como si fuera
  // el primer registro de datos.
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}&headers=1`;

  const statusEl = document.getElementById("sheet-sync-status");
  const timeEl = document.getElementById("sheet-sync-time");
  const listEl = document.getElementById("sheet-sync-list");
  const countEl = document.getElementById("sheet-sync-count");

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Devuelve el valor de una celda como texto, o "" si está vacía / no existe
  function cellValue(row, colIndex) {
    const cell = row.c[colIndex];
    if (!cell || cell.v === null || cell.v === undefined) return "";
    const str = String(cell.v).trim();
    return str;
  }

  // Igual que cellValue, pero SIN recortar espacios. Se usa solo para la
  // primera columna, porque ahí un espacio en blanco (" ") debe contar
  // como "tiene un carácter" y no como celda vacía.
  function cellValueRaw(row, colIndex) {
    const cell = row.c[colIndex];
    if (!cell || cell.v === null || cell.v === undefined) return "";
    return String(cell.v);
  }

  function isUrl(value) {
    return URL_REGEX.test(value);
  }

  // A partir de una URL, arma un texto de enlace legible sin depender del
  // nombre de la columna: usa el dominio (sin "www."), que suele bastar
  // para identificar de qué servicio se trata (spotify, youtube, etc).
  function linkLabelFromUrl(value) {
    try {
      const host = new URL(value).hostname.replace(/^www\./, "");
      return host;
    } catch (e) {
      return "Abrir enlace";
    }
  }

  function formatValue(value) {
    if (isUrl(value)) {
      const safeUrl = escapeHtml(value);
      const label = escapeHtml(linkLabelFromUrl(value));
      return `<a href="${safeUrl}" target="_blank" rel="noopener">${label}</a>`;
    }
    return escapeHtml(value);
  }

  async function syncSheet() {
    statusEl.textContent = "Sincronizando...";
    try {
      const res = await fetch(url);
      const text = await res.text();
      // La respuesta viene envuelta como: google.visualization.Query.setResponse({...});
      const json = JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1));
      const rows = json.table.rows;
      const cols = json.table.cols;

      // Encabezados dinámicos, en el orden en que figuran en la planilla.
      // Si una columna no tiene encabezado, se le pone un nombre genérico.
      const headers = cols.map((c, i) => (c.label && c.label.trim()) || `Columna ${i + 1}`);

      // Arma primero la lista de registros (filas con al menos un dato) para
      // poder contarlos antes de convertirlos en HTML.
      const recordFields = rows
        .map(r => {
          // La primera columna decide si el registro existe: si no tiene
          // NINGÚN carácter se descarta. Si tiene al menos un carácter
          // (aunque sea un espacio en blanco " "), el registro se toma y
          // se muestra igual que cualquier otro (por eso acá NO se usa
          // cellValue, que recorta espacios, sino cellValueRaw).
          const firstColRaw = cellValueRaw(r, 0);
          if (firstColRaw.length === 0) return null;

          // El resto de las columnas sigue funcionando como antes:
          // se descartan las que no tengan dato.
          const restFields = headers
            .slice(1)
            .map((header, i) => ({ header, value: cellValue(r, i + 1) }))
            .filter(f => f.value !== "");

          return [{ header: headers[0], value: firstColRaw }, ...restFields];
        })
        .filter(fields => fields !== null); // descarta solo las filas sin primera columna

      countEl.textContent = `Actualizados: ${recordFields.length} Registros`;

      listEl.innerHTML = recordFields
        .map(fields => {
          // La primera columna con dato de la fila se usa como título del
          // registro (posición, no nombre). El resto se lista debajo.
          const [titleField, ...restFields] = fields;

          const titleHtml = isUrl(titleField.value)
            ? `<a href="${escapeHtml(titleField.value)}" target="_blank" rel="noopener">${escapeHtml(titleField.value)}</a>`
            : escapeHtml(titleField.value);

          const restHtml = restFields
            .map(f => `<span class="extra-field"><strong>${escapeHtml(f.header)}:</strong> ${formatValue(f.value)}</span>`)
            .join("");

          return `
            <div class="record">
              <span class="record-title">${titleHtml}</span>
              ${restHtml}
            </div>`;
        })
        .join("");

      if (!listEl.innerHTML) {
        listEl.innerHTML = '<p style="color:#999;font-size:14px;">No se encontraron registros.</p>';
      }

      statusEl.textContent = "";
      timeEl.textContent = new Date().toLocaleTimeString();
    } catch (err) {
      statusEl.textContent = "No se pudo sincronizar. Verificá que la hoja sea pública ('cualquiera con el enlace').";
      console.error(err);
    }
  }

  document.getElementById("sheet-sync-refresh").addEventListener("click", syncSheet);
  syncSheet();
  setInterval(syncSheet, REFRESH_MS);
})();
</script>
